<body>
  <apartment-navigation></apartment-navigation>
  <main class="library-main full-apartment">
    <section class="library-heading" aria-labelledby="full-apartment-heading">
      <div>
        <h1 id="full-apartment-heading">Full apartment</h1>
        <p>Centred view from above the entrance, looking toward the terrace.</p>
      </div>
      <a class="before-button" href="index.html#plan">Floor plan ↗</a>
    </section>
    <div class="apartment-views">
      <div class="apartment-view-options" role="group" aria-label="Furniture in the image">
        <label><input type="checkbox" value="bed"> Scepter Oak bed</label>
        <label><input type="checkbox" value="desk"> Black desk</label>
        <label><input type="checkbox" value="sofa"> L-shaped sofa</label>
        <label><input type="checkbox" value="rug"> Woven rug</label>
        <label><input type="checkbox" value="table"> Glass dining table</label>
        <label><input type="checkbox" value="console"> TV console</label>
        <label title="The TV stands on the console"><input type="checkbox" value="tv"> Standing TV</label>
      </div>
      <figure class="apartment-cutaway" id="empty-apartment">
        <a id="open-apartment-image" class="apartment-image" href="source/4 - Interior design proposals/full-apartment-empty-03.png" target="_blank" rel="noopener" aria-label="Open full-size apartment image">
          <img loading="lazy" id="apartment-base-image" src="source/4 - Interior design proposals/full-apartment-empty-03.png" width="1408" height="1117" alt="Centred cutaway of the empty apartment with fitted kitchen and wardrobes.">
          <canvas id="apartment-furniture-canvas" width="1408" height="1117" role="img" hidden></canvas>
        </a>
        <figcaption>
          <div>
            <h2 id="apartment-view-title">Empty apartment</h2>
            <p id="apartment-view-details">The fridge, kitchen cabinets and bedroom wardrobe share the walls’ 1.12 m cut line.</p>
          </div>
          <a id="save-apartment-image" href="source/4 - Interior design proposals/full-apartment-empty-03.png" download="full-apartment-empty-03.png">Save image ↗</a>

      </figure>

    </div>
    <dl class="apartment-measurements" aria-label="Key interior measurements in metres">
      <div><dt>Living area and kitchen · width × total depth</dt><dd>4.17 × 8.77 m</dd></div>
