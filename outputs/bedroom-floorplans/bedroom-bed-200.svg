<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" role="img" aria-labelledby="title description">
<title id="title">Bedroom Centred: 2.00 × 2.00 m bed, nightstands, desk and chair</title>
<desc id="description">Clear room 4.17 by 3.62 metres. Bed head at right, two 0.50 by 0.40 metre nightstands. Desk on left wall, 1.00 metre along wall by 0.60 deep; chair faces left. Four wardrobe doors assumed 0.60 metre each per owner. Bed to closed wardrobe 0.81, beyond open door tip 0.21. Wardrobe-side nightstand gap 0.26 metre. Door-swing conflict: True. Window-side nightstand to glazing 0.26 metre; a negative value is overlap. Official Stoa frame included; chair-to-frame gap 0.73 metre. Overall frame width is mattress plus 0.03 metre; length 2.04 metres.</desc>
